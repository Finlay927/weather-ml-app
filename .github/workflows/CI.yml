name: CI Pipeline

on:
  push:
    branches:
      - main
      - ci-cd-pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "smoke_test.py" -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "unit_test.py" -v

      - name: Run integration tests
        run: python -m unittest discover -s tests -p "integration_test.py" -v

      - name: Build Docker image
        run: docker build -t weather-ml-app:v1 .

      - name: Test Docker container
        run: |
          docker run -d --name weather-test -p 5000:5000 weather-ml-app:v1
          sleep 10
          docker exec weather-test python --version

      - name: Clean up test container
        if: always()
        run: docker rm -f weather-test