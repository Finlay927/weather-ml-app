- name: kubernetes Setup
  hosts: localhost
  user: ubuntu
  become: yes

  tasks:
  - name: 1. Install kubectl
    apt:
      name: kubectl
      state: present
      update_cache: yes

  - name: 2. Download Minikube
    get_url:
      url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
      dest: /tmp/minikube-linux-amd64

  - name: 3. Install Minikube
    shell:
      cmd: install /tmp/minikube-linux-amd64 /usr/local/bin/minikube

  - name: 4. Ubuntu is in the docker group
    shell:
      cmd: sudo usermod -aG docker ubuntu

  - name: 5. Start Minikube
    become: no
    shell:
      cmd: minikube start --driver=docker

  - name: 6. Deploy Application
    shell:
      cmd: kubectl apply -f deployment.yml

  - name: 7. Create Service
    shell:
      cmd: kubectl apply -f service.yml

  - name: 8. Scale Deployment
    shell:
      cmd: kubectl scale deployment myapp --replicas=3

