---
- name: Deploy the weather ML application to Kubernetes
  hosts: production
  become: false

  vars:
    manifest_dir: "{{ playbook_dir }}/../k8s"
    deployment_name: weather-ml-app

  tasks:
    - name: Confirm the Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Apply the Deployment manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ manifest_dir }}/deployment.yaml"
      register: apply_result
      changed_when: "'unchanged' not in apply_result.stdout"

    - name: Wait for the rollout to complete
      ansible.builtin.command:
        cmd: "kubectl rollout status deployment/{{ deployment_name }} --timeout=180s"
      register: rollout_result
      changed_when: false

    - name: Gather the running pods
      ansible.builtin.command:
        cmd: "kubectl get pods -l app={{ deployment_name }} -o wide"
      register: pod_list
      changed_when: false

    - name: Show the deployment result
      ansible.builtin.debug:
        msg: "{{ apply_result.stdout_lines + rollout_result.stdout_lines + pod_list.stdout_lines }}"
